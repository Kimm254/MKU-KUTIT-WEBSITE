<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUTIT Admin Login</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="admin-body"><main class="admin-wrap"><a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">K</span><span>MKU <b>KUTIT</b><small>ADMINISTRATION</small></span></a><section class="admin-card"><p class="section-tag">RESTRICTED AREA</p><h1>Admin login</h1><p class="muted">Sign in to manage the KUTIT website.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}<form method="POST"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="btn btn-gold submit-btn" type="submit">Sign in <span>→</span></button></form><a class="back-link" href="{{ url_for('home') }}">← Back to website</a></section></main></body></html>
